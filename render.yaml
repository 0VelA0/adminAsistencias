services:
  - type: web
    name: asistencia-integra-profesional
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: COMPANY_LATITUDE
        sync: false
      - key: COMPANY_LONGITUDE
        sync: false
      - key: ALLOWED_RADIUS_METERS
        value: "200"
      - key: DATABASE_URL
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        value: vela@integraprofesional.com
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: EMPLOYEE_INITIAL_PASSWORD
        sync: false
      - key: ATTENDANCE_STATION_CODE
        value: recepcion
