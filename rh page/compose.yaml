services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendance}
      POSTGRES_USER: ${POSTGRES_USER:-attendance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://attendance:change-me@db:5432/attendance}
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-me}
      COMPANY_LATITUDE: ${COMPANY_LATITUDE:-20.967370}
      COMPANY_LONGITUDE: ${COMPANY_LONGITUDE:--89.592586}
      ALLOWED_RADIUS_METERS: ${ALLOWED_RADIUS_METERS:-200}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@example.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-ChangeMe123!}
      EMPLOYEE_INITIAL_PASSWORD: ${EMPLOYEE_INITIAL_PASSWORD:-Bienvenida2026!}
      ATTENDANCE_STATION_CODE: ${ATTENDANCE_STATION_CODE:-recepcion}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      JWT_EXPIRY_DAYS: ${JWT_EXPIRY_DAYS:-30}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
